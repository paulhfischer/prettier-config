- id: lint
  name: Format most files
  entry: prettier
  language: node
  args:
    - '--write'
    - '--list-different'
    - '--ignore-unknown'
    - '--log-level=warn'
  additional_dependencies:
    - prettier@3.9.10
  types:
    - file
  exclude: ((^|/)node_modules/|\.min\.(css|js)$|\.(html|php)$)
